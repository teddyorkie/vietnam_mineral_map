[project]
name = "vietnam-mineral-map"
version = "0.1.0"
description = "Interactive FastAPI web map of mineral resources across Vietnam's 34 post-2025 provinces and cities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
mysql = [
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "shapely>=2.0.6",
    "ruff>=0.8.0",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
